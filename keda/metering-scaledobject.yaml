apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: { name: metering-consumer }
spec:
  scaleTargetRef: { name: metering }
  pollingInterval: 15
  cooldownPeriod: 120
  minReplicaCount: 0
  maxReplicaCount: 20
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka:9092
        consumerGroup: metering-cg
        topic: meter.usage.v1
        lagThreshold: "5000"
