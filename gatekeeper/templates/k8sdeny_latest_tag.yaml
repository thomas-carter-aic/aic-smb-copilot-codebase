apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata: { name: k8sdenylatesttag }
spec:
  crd:
    spec:
      names:
        kind: K8sDenyLatestTag
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdenylatesttag
        violation[{"msg": msg}] {
          input.review.kind.kind == "Pod" or input.review.kind.kind == "Deployment"
          some c
          container := input_containers[c]
          endswith(container.image, ":latest")
          msg := sprintf("image %v uses 'latest' tag", [container.image])
        }
        input_containers[c] := container {
          container := input.review.object.spec.template.spec.containers[c]
        } else := container {
          container := input.review.object.spec.containers[c]
        }
