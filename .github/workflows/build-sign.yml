name: build-sign

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NS: ${{ github.repository }}

jobs:
  discover:
    name: Discover services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        shell: bash
        run: |
          set -euo pipefail
          arr="[]"
          if [ -d "services" ]; then
            for d in services/* ; do
              [ -d "$d" ] || continue
              svc=$(basename "$d")
              if [ -f "$d/Dockerfile" ]; then
                arr=$(jq -c --arg s "$svc" '. + [{ "service": $s }]' <<<"$arr")
              fi
            done
          fi
          if [ "$arr" = "[]" ]; then
            arr='[{"service":"api-gateway"},{"service":"identity"},{"service":"profiles"},{"service":"catalog"},{"service":"workflow"},{"service":"orders"},{"service":"payments"},{"service":"inventory"},{"service":"notifications"},{"service":"ai-rag"},{"service":"tenant"},{"service":"entitlements"},{"service":"metering"},{"service":"billing"},{"service":"apikeys"},{"service":"audit"},{"service":"job-queue"},{"service":"model-mgmt"},{"service":"governance"},{"service":"portal"}]'
          fi
          echo "matrix={"include":$arr}" >> "$GITHUB_OUTPUT"
          echo "Matrix -> $arr"

  build:
    name: Build, push, SBOM, sign, attest
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch) 🔧
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx 🔧
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR 🗝️
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata 🏷️
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NS }}/${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build (and push on non-PR) 🚀
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || '' }}

      - name: Cosign install
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Generate SBOM (SPDX) 📦
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NS }}/${{ matrix.service }}:sha-${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json

      - name: Upload SBOM artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json

      - name: Sign image (cosign keyless) 🔏
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NS }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}"
          echo "Signing $IMG"
          cosign sign --yes "$IMG"

      - name: Attest SBOM (SPDX) 📜
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NS }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}"
          cosign attest --yes --predicate sbom-${{ matrix.service }}.spdx.json --type spdx "$IMG"

      - name: Generate SLSA build provenance ✅
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NS }}/${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
