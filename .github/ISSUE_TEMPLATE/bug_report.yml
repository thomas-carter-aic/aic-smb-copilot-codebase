name: Bug report
description: File a bug report
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes: { label: What happened?, description: Tell us what you saw }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Reproduction steps }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
  - type: textarea
    id: logs
    attributes: { label: Logs/Traces }
