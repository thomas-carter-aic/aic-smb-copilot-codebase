
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: platform
  labels: { app: payments }
spec:
  replicas: 2
  selector: { matchLabels: { app: payments } }
  template:
    metadata: { labels: { app: payments } }
    spec:
      containers:
        - name: payments
          image: ghcr.io/OWNER/REPO/payments:latest
          ports: [{ containerPort: 8080, name: http }]
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 3 }
          livenessProbe:  { httpGet: { path: /health, port: http }, initialDelaySeconds: 10 }
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: platform
spec:
  selector: { app: payments }
  ports:
    - name: http
      port: 80
      targetPort: http
