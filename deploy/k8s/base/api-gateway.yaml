
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: platform
  labels: { app: api-gateway }
spec:
  replicas: 2
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/thomas-carter-aic/aic-smb-copilot-codebase/api-gateway:latest
          ports: [{ containerPort: 8080, name: http }]
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 3 }
          livenessProbe:  { httpGet: { path: /health, port: http }, initialDelaySeconds: 10 }
      env:
        - name: ORDERS_URL
          value: "http://orders.platform.svc.cluster.local"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: platform
spec:
  selector: { app: api-gateway }
  ports:
    - name: http
      port: 80
      targetPort: http
